<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Modern Glassmorphism Calculator App generated by Kairo-AI software engineering engine">
  <title>Kairo Glassmorphism Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-glob glob-1"></div>
  <div class="background-glob glob-2"></div>
  <div class="background-glob glob-3"></div>

  <main class="app-container">
    <header class="calculator-header">
      <div class="brand">
        <span class="brand-badge">KAIRO AI</span>
        <h1 class="brand-title">Calculator</h1>
      </div>
      <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme" title="Toggle Dark/Light Mode">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </header>

    <section class="display-card">
      <div id="history-display" class="history-display" aria-live="polite"></div>
      <div id="primary-display" class="primary-display" aria-live="polite">0</div>
    </section>

    <section class="keypad-card">
      <div class="keypad-row memory-row">
        <button class="btn btn-memory" data-action="mc">MC</button>
        <button class="btn btn-memory" data-action="mr">MR</button>
        <button class="btn btn-memory" data-action="m-plus">M+</button>
        <button class="btn btn-memory" data-action="m-minus">M-</button>
      </div>

      <div class="keypad-grid">
        <button class="btn btn-function" data-action="clear" id="btn-clear">AC</button>
        <button class="btn btn-function" data-action="backspace" aria-label="Backspace">⌫</button>
        <button class="btn btn-function" data-action="percent">%</button>
        <button class="btn btn-operator" data-action="divide">÷</button>

        <button class="btn btn-function" data-action="square-root">√</button>
        <button class="btn btn-function" data-action="square">x²</button>
        <button class="btn btn-function" data-action="negate">±</button>
        <button class="btn btn-operator" data-action="multiply">×</button>

        <button class="btn btn-digit" data-value="7">7</button>
        <button class="btn btn-digit" data-value="8">8</button>
        <button class="btn btn-digit" data-value="9">9</button>
        <button class="btn btn-operator" data-action="subtract">-</button>

        <button class="btn btn-digit" data-value="4">4</button>
        <button class="btn btn-digit" data-value="5">5</button>
        <button class="btn btn-digit" data-value="6">6</button>
        <button class="btn btn-operator" data-action="add">+</button>

        <button class="btn btn-digit" data-value="1">1</button>
        <button class="btn btn-digit" data-value="2">2</button>
        <button class="btn btn-digit" data-value="3">3</button>
        <button class="btn btn-equals" data-action="calculate" id="btn-equals">=</button>

        <button class="btn btn-digit btn-zero" data-value="0">0</button>
        <button class="btn btn-digit" data-value=".">.</button>
      </div>
    </section>

    <footer class="calculator-footer">
      <span>Keyboard Shortcuts Supported</span>
      <span class="dot">•</span>
      <span>Kairo-AI Runtime Engine</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
